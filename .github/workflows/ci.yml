name: CI

on:
  push:
    branches: [main, master, chore/**]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: billing_ci
          POSTGRES_USER: billing_ci
          POSTGRES_PASSWORD: billing_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_ci -d billing_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django check (PostgreSQL)
        env:
          DJANGO_SECRET_KEY: ci-only-secret-32-characters-long
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: billing_ci
          POSTGRES_USER: billing_ci
          POSTGRES_PASSWORD: billing_ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: python manage.py check
      - name: Apply migrations (PostgreSQL)
        env:
          DJANGO_SECRET_KEY: ci-only-secret-32-characters-long
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: billing_ci
          POSTGRES_USER: billing_ci
          POSTGRES_PASSWORD: billing_ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: python manage.py migrate --noinput
      - name: Validate PostgreSQL schema
        env:
          DJANGO_SECRET_KEY: ci-only-secret-32-characters-long
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: billing_ci
          POSTGRES_USER: billing_ci
          POSTGRES_PASSWORD: billing_ci_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: >-
          python manage.py shell -c
          "from django.db import connection; tables=connection.introspection.table_names(); assert 'billing_provider' in tables and 'billing_invoice' in tables; print('PostgreSQL schema OK')"
      - name: Tests (SQLite fast suite)
        env:
          DJANGO_SECRET_KEY: ci-only-secret-32-characters-long
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_TESTING: '1'
        run: python manage.py test
      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-32-characters-long
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_TESTING: '1'
        run: python manage.py collectstatic --noinput
      - name: Docker Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: '1'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
          POSTGRES_DB: billing_db
          POSTGRES_USER: billing_user
          POSTGRES_PASSWORD: billing_pass
          POSTGRES_HOST: db
          POSTGRES_PORT: '5432'
        run: docker compose config

